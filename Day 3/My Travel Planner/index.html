<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Travel Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My Travel Planner</h1>

        <p>Plan your dream trip!</p>

        <label>Destination</label>
        <input type="text" id="destination" placeholder="Enter destination">

        <label>Number of Days</label>
        <input type="number" id="days" placeholder="Enter number of days">

        <label>Daily Budget (₹)</label>
        <input type="number" id="budget" placeholder="Enter daily budget">

        <button onclick="calculateBudget()">
            Calculate My Trip
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
