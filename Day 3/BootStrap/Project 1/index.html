<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bootstrap Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Connects Bootstrap CSS using its CDN -->
</head>
<body>
    <div class="container">
        <h1 class="text-primary">
            Welcome to Bootstrap
        </h1>
    </div>

    <div class="container mt-4">
        <button class="btn btn-danger">
            Danger
        </button>
    </div>



    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="bg-primary text-white p-4">
                    Column 1
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-danger text-white p-4">
                    Column 2
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-success text-white p-4">
                    Column 3
                </div>
            </div>
        </div>    
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card shadow">
                    <img src="https://images.unsplash.com/photo-1793774263030-609d2c421a4a?w=1600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top"
                        alt="Image">
                    <div class="card-body">
                        <h5 class="card-title">
                            Gunashree
                        </h5>
                        <p class="card-text">
                            AI Engineer
                        </p>
                        <a href="" class="btn btn-success">
                            View Profile
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
    
</body>
</html>
