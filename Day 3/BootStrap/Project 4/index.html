
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini Product Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>

        /* Main page styling */
        body {
            background: #f5f6fa;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: #172554;
        }

        /* Hero section */
        .hero {
            background: linear-gradient(135deg, #172554, #4338ca);
            color: white;
            padding: 55px 20px;
            text-align: center;
        }

        /* Product card */
        .product-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            height: 100%;
            transition: 0.3s;
        }

        /* Hover effect */
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.12);
        }

        /* Product image */
        .product-card img {
            height: 210px;
            width: 100%;
            object-fit: cover;
        }

        /* Cart area */
        .cart-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        /* Price text */
        .price {
            color: #4338ca;
            font-size: 21px;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #172554;
            color: white;
            padding: 20px;
            text-align: center;
        }

    </style>
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-shop"></i>
                Mini Store
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#storeMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="storeMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#products">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#cart">
                            Cart
                            <span class="badge bg-warning text-dark"
                                  id="cartCount">0</span>
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Hero section -->
    <section class="hero">

        <div class="container">

            <h1 class="display-4 fw-bold">
                Welcome to Mini Store
            </h1>

            <p class="lead">
                Discover products you will love.
            </p>

            <a href="#products" class="btn btn-warning btn-lg mt-2">
                Shop Now
            </a>

        </div>

    </section>

    <!-- Product section -->
    <section class="py-5" id="products">

        <div class="container">

            <div class="text-center mb-4">

                <h2 class="fw-bold">Our Products</h2>

                <p class="text-muted">
                    Choose your favourite products
                </p>

            </div>

            <!-- Search and category filter -->
            <div class="row g-3 mb-4">

                <div class="col-12 col-md-6">

                    <input type="text"
                           id="searchInput"
                           class="form-control form-control-lg"
                           placeholder="Search products...">

                </div>

                <div class="col-12 col-md-6">

                    <select id="categoryFilter"
                            class="form-select form-select-lg">

                        <option value="all">All Categories</option>
                        <option value="electronics">Electronics</option>
                        <option value="fashion">Fashion</option>
                        <option value="accessories">Accessories</option>

                    </select>

                </div>

            </div>

            <!-- Products will appear here -->
            <div class="row g-4" id="productList"></div>

            <p id="noProducts"
               class="text-center text-muted d-none mt-4">
                No products found.
            </p>

        </div>

    </section>

    <!-- Shopping cart -->
    <section class="py-5 bg-light" id="cart">

        <div class="container">

            <div class="cart-box shadow-sm">

                <h2 class="fw-bold mb-4">
                    <i class="bi bi-cart3"></i>
                    Shopping Cart
                </h2>

                <!-- Cart items appear here -->
                <div id="cartItems">

                    <p class="text-muted">
                        Your cart is empty.
                    </p>

                </div>

                <hr>

                <div class="d-flex justify-content-between">

                    <h4>Total:</h4>

                    <h4 class="text-primary" id="cartTotal">
                        ₹0
                    </h4>

                </div>

                <button class="btn btn-danger mt-3"
                        onclick="clearCart()">

                    <i class="bi bi-trash"></i>
                    Clear Cart

                </button>

                <button class="btn btn-success mt-3"
                        onclick="checkout()">

                    <i class="bi bi-credit-card"></i>
                    Checkout

                </button>

            </div>

        </div>

    </section>

    <!-- Footer -->
    <footer>

        <p class="mb-0">
            © 2026 Mini Store | Built with Bootstrap and JavaScript
        </p>

    </footer>


    <!-- JavaScript starts here -->
    <script>

        // STEP 1: Create an array of products
        const products = [

            {
                id: 1,
                name: "Wireless Headphones",
                category: "electronics",
                price: 1499,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600",
                description: "High-quality wireless headphones."
            },

            {
                id: 2,
                name: "Smart Watch",
                category: "electronics",
                price: 2499,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600",
                description: "Track your fitness and daily activity."
            },

            {
                id: 3,
                name: "Casual Shoes",
                category: "fashion",
                price: 1999,
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600",
                description: "Comfortable shoes for everyday use."
            },

            {
                id: 4,
                name: "Backpack",
                category: "fashion",
                price: 999,
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600",
                description: "Stylish backpack for students."
            },

            {
                id: 5,
                name: "Sunglasses",
                category: "accessories",
                price: 799,
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600",
                description: "Modern sunglasses for everyday style."
            },

            {
                id: 6,
                name: "Wrist Watch",
                category: "accessories",
                price: 1299,
                image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600",
                description: "Elegant watch with a classic design."
            }

        ];


        // STEP 2: Create an empty shopping cart
        let cart = [];


        // STEP 3: Select HTML elements
        const productList = document.getElementById("productList");

        const cartItems = document.getElementById("cartItems");

        const cartTotal = document.getElementById("cartTotal");

        const cartCount = document.getElementById("cartCount");

        const searchInput = document.getElementById("searchInput");

        const categoryFilter = document.getElementById("categoryFilter");


        // STEP 4: Display all products
        function displayProducts(productArray) {

            // Clear existing product cards
            productList.innerHTML = "";

            // Show message if there are no products
            document.getElementById("noProducts")
                .classList.toggle("d-none", productArray.length !== 0);

            // Loop through the product array
            productArray.forEach(function(product) {

                // Create a Bootstrap column and card
                const productCard = document.createElement("div");

                productCard.className = "col-12 col-sm-6 col-lg-4";

                // Add product information inside the card
                productCard.innerHTML = `

                    <div class="card product-card shadow-sm">

                        <img src="${product.image}"
                             class="card-img-top"
                             alt="${product.name}">

                        <div class="card-body">

                            <span class="badge bg-secondary mb-2">
                                ${product.category}
                            </span>

                            <h5 class="card-title fw-bold">
                                ${product.name}
                            </h5>

                            <p class="text-muted">
                                ${product.description}
                            </p>

                            <p class="price">
                                ₹${product.price.toLocaleString("en-IN")}
                            </p>

                            <button class="btn btn-primary w-100"
                                    onclick="addToCart(${product.id})">

                                <i class="bi bi-cart-plus"></i>
                                Add to Cart

                            </button>

                        </div>

                    </div>

                `;

                // Add the card to the page
                productList.appendChild(productCard);

            });

        }


        // STEP 5: Add a product to the cart
        function addToCart(productId) {

            // Find the selected product
            const selectedProduct = products.find(function(product) {
                return product.id === productId;
            });

            // Check whether the product is already in the cart
            const existingItem = cart.find(function(item) {
                return item.id === productId;
            });

            // Increase quantity if it already exists
            if (existingItem) {

                existingItem.quantity++;

            } else {

                // Otherwise add it as a new cart item
                cart.push({
                    ...selectedProduct,
                    quantity: 1
                });

            }

            // Refresh the cart
            updateCart();

        }


        // STEP 6: Display cart items and calculate total
        function updateCart() {

            // Clear previous cart content
            cartItems.innerHTML = "";

            // Start total at zero
            let total = 0;

            // Start item count at zero
            let count = 0;

            // Check if cart is empty
            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <p class="text-muted">Your cart is empty.</p>
                `;

            }

            // Loop through every cart item
            cart.forEach(function(item) {

                // Calculate subtotal for this item
                const subtotal = item.price * item.quantity;

                // Add subtotal to total
                total += subtotal;

                // Add quantity to cart count
                count += item.quantity;

                // Create a cart row
                const cartRow = document.createElement("div");

                cartRow.className =
                    "d-flex justify-content-between align-items-center border-bottom py-3 gap-3";

                // Display item details and quantity buttons
                cartRow.innerHTML = `

                    <div>
                        <h6 class="mb-1">${item.name}</h6>

                        <small class="text-muted">
                            ₹${item.price.toLocaleString("en-IN")} each
                        </small>
                    </div>

                    <div class="d-flex align-items-center gap-2">

                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="changeQuantity(${item.id}, -1)">
                            -
                        </button>

                        <span>${item.quantity}</span>

                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="changeQuantity(${item.id}, 1)">
                            +
                        </button>

                    </div>

                    <strong>
                        ₹${subtotal.toLocaleString("en-IN")}
                    </strong>

                `;

                // Add row to cart
                cartItems.appendChild(cartRow);

            });

            // Update total amount
            cartTotal.textContent = "₹" + total.toLocaleString("en-IN");

            // Update cart badge
            cartCount.textContent = count;

        }


        // STEP 7: Change product quantity
        function changeQuantity(productId, change) {

            // Find the product in the cart
            const item = cart.find(function(cartItem) {
                return cartItem.id === productId;
            });

            // Change quantity
            if (item) {

                item.quantity += change;

                // Remove product if quantity becomes zero
                if (item.quantity <= 0) {

                    cart = cart.filter(function(cartItem) {
                        return cartItem.id !== productId;
                    });

                }

            }

            // Refresh cart
            updateCart();

        }


        // STEP 8: Clear the entire cart
        function clearCart() {

            // Ask for confirmation
            const confirmed = confirm("Are you sure you want to clear the cart?");

            if (confirmed) {

                cart = [];

                updateCart();

            }

        }


        // STEP 9: Search products
        function filterProducts() {

            // Get search text in lowercase
            const searchText = searchInput.value.toLowerCase();

            // Get selected category
            const selectedCategory = categoryFilter.value;

            // Filter products using both conditions
            const filteredProducts = products.filter(function(product) {

                const matchesSearch =
                    product.name.toLowerCase().includes(searchText);

                const matchesCategory =
                    selectedCategory === "all" ||
                    product.category === selectedCategory;

                return matchesSearch && matchesCategory;

            });

            // Display matching products
            displayProducts(filteredProducts);

        }


        // STEP 10: Checkout demonstration
        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;

            }

            alert(
                "Thank you for shopping!\nYour total is " +
                cartTotal.textContent +
                "\nThis is a demo store; no payment was taken."
            );

        }


        // STEP 11: Listen for search input
        searchInput.addEventListener("input", filterProducts);


        // STEP 12: Listen for category selection
        categoryFilter.addEventListener("change", filterProducts);


        // STEP 13: Display products when page loads
        displayProducts(products);

        // Display the initial empty cart
        updateCart();

    </script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
